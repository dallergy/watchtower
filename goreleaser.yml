version: 2

project_name: watchtower

builds:
  - id: watchtower
    main: .
    binary: watchtower
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    tags:
      # embed the time zone database, as the container image has none
      - timetzdata
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    goarm:
      - "6"
      - "7"
    ignore:
      - goos: windows
        goarch: arm
    ldflags:
      - -s -w -X github.com/dallergy/watchtower/internal/meta.Version={{ .Version }}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    files:
      - LICENSE.md

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  use: github-native

dockers_v2:
  - ids:
      - watchtower
    dockerfile: dockerfiles/Dockerfile
    images:
      - shounak6942/watchtower
      - ghcr.io/dallergy/watchtower
    tags:
      - "{{ .Version }}"
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/386
      - linux/arm/v6
      - linux/arm/v7
      - linux/arm64
    labels:
      org.opencontainers.image.title: Watchtower
      org.opencontainers.image.description: Automatically update running Docker containers
      org.opencontainers.image.source: https://github.com/dallergy/watchtower
      org.opencontainers.image.url: https://github.com/dallergy/watchtower
      org.opencontainers.image.documentation: https://dallergy.github.io/watchtower/
      org.opencontainers.image.licenses: Apache-2.0
      org.opencontainers.image.version: "{{ .Version }}"
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.created: "{{ .Date }}"
    sbom: true
