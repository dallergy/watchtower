version: 2

builds:
  - main: ./main.go
    binary: watchtower
    goos:
      - linux
      - windows
    goarch:
      - amd64
      - "386"
      - arm
      - arm64
    ldflags:
      - -s -w -X github.com/containrrr/watchtower/internal/meta.Version={{.Version}}

archives:
  - name_template: "{{.ProjectName}}_{{.Os}}_{{.Arch}}"
    format: tar.gz
    format_overrides:
      - goos: windows
        format: zip
    files:
      - LICENSE.md

dockers:
  - use: buildx
    goos: linux
    goarch: amd64
    dockerfile: dockerfiles/Dockerfile
    image_templates:
      - "shounak9642/watchtower:amd64-{{ .Version }}"
      - "shounak9642/watchtower:amd64-latest"
      - "ghcr.io/dallergy/watchtower:amd64-{{ .Version }}"
      - "ghcr.io/dallergy/watchtower:amd64-latest"
    binaries:
      - watchtower
  - use: buildx
    goos: linux
    goarch: "386"
    dockerfile: dockerfiles/Dockerfile
    image_templates:
      - "shounak9642/watchtower:i386-{{ .Version }}"
      - "shounak9642/watchtower:i386-latest"
      - "ghcr.io/dallergy/watchtower:i386-{{ .Version }}"
      - "ghcr.io/dallergy/watchtower:i386-latest"
    binaries:
      - watchtower
  - use: buildx
    goos: linux
    goarch: arm
    goarm: "6"
    dockerfile: dockerfiles/Dockerfile
    image_templates:
      - "shounak9642/watchtower:armhf-{{ .Version }}"
      - "shounak9642/watchtower:armhf-latest"
      - "ghcr.io/dallergy/watchtower:armhf-{{ .Version }}"
      - "ghcr.io/dallergy/watchtower:armhf-latest"
    binaries:
      - watchtower
  - use: buildx
    goos: linux
    goarch: arm64
    dockerfile: dockerfiles/Dockerfile
    image_templates:
      - "shounak9642/watchtower:arm64v8-{{ .Version }}"
      - "shounak9642/watchtower:arm64v8-latest"
      - "ghcr.io/dallergy/watchtower:arm64v8-{{ .Version }}"
      - "ghcr.io/dallergy/watchtower:arm64v8-latest"
    binaries:
      - watchtower

docker_manifests:
  - name_template: "shounak9642/watchtower:{{ .Version }}"
    image_templates:
      - "shounak9642/watchtower:amd64-{{ .Version }}"
      - "shounak9642/watchtower:i386-{{ .Version }}"
      - "shounak9642/watchtower:armhf-{{ .Version }}"
      - "shounak9642/watchtower:arm64v8-{{ .Version }}"
  - name_template: "shounak9642/watchtower:latest"
    image_templates:
      - "shounak9642/watchtower:amd64-latest"
      - "shounak9642/watchtower:i386-latest"
      - "shounak9642/watchtower:armhf-latest"
      - "shounak9642/watchtower:arm64v8-latest"
  - name_template: "ghcr.io/dallergy/watchtower:{{ .Version }}"
    image_templates:
      - "ghcr.io/dallergy/watchtower:amd64-{{ .Version }}"
      - "ghcr.io/dallergy/watchtower:i386-{{ .Version }}"
      - "ghcr.io/dallergy/watchtower:armhf-{{ .Version }}"
      - "ghcr.io/dallergy/watchtower:arm64v8-{{ .Version }}"
  - name_template: "ghcr.io/dallergy/watchtower:latest"
    image_templates:
      - "ghcr.io/dallergy/watchtower:amd64-latest"
      - "ghcr.io/dallergy/watchtower:i386-latest"
      - "ghcr.io/dallergy/watchtower:armhf-latest"
      - "ghcr.io/dallergy/watchtower:arm64v8-latest"
