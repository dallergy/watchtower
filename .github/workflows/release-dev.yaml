name: Push to main

on:
  workflow_dispatch: {}
  push:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.22.x
      - name: Test
        run: go test -v -coverprofile coverage.out -covermode atomic ./...
      - name: Publish coverage
        uses: codecov/codecov-action@v6
        with:
          token: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    needs: test
    env:
      DOCKER_IMAGE: ${{ secrets.DOCKER_USERNAME }}/watchtower
    steps:
      - uses: actions/checkout@v5
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Ensure Docker Hub repository exists
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          TOKEN=$(curl -fsS -H "Content-Type: application/json" \
            -X POST -d "{\"username\": \"${DOCKER_USERNAME}\", \"password\": \"${DOCKER_PASSWORD}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "Failed to authenticate with Docker Hub"
            exit 1
          fi
          STATUS=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: JWT ${TOKEN}" \
            "https://hub.docker.com/v2/repositories/${DOCKER_USERNAME}/watchtower/")
          if [ "$STATUS" = "404" ]; then
            curl -fsS -H "Authorization: JWT ${TOKEN}" -H "Content-Type: application/json" \
              -X POST -d "{\"namespace\":\"${DOCKER_USERNAME}\",\"name\":\"watchtower\",\"description\":\"Community-maintained Watchtower fork\",\"is_private\":false}" \
              https://hub.docker.com/v2/repositories/
            echo "Created Docker Hub repository ${DOCKER_USERNAME}/watchtower"
          elif [ "$STATUS" = "200" ]; then
            echo "Docker Hub repository ${DOCKER_USERNAME}/watchtower already exists"
          else
            echo "Unexpected status checking Docker Hub repository: ${STATUS}"
            exit 1
          fi
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Publish to Docker Hub
        continue-on-error: true
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Dockerfile.dev-self-contained
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.DOCKER_IMAGE }}:latest
            ${{ env.DOCKER_IMAGE }}:latest-dev
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish to GHCR
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Dockerfile.dev-self-contained
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dallergy/watchtower:latest
            ghcr.io/dallergy/watchtower:latest-dev
