# Lean Watchtower stack. Copy `.env.example` to `.env` for local overrides
# (Compose substitutes ${VARS} from `.env`; listed `environment` keys are passed into the container).

services:
  watchtower:
    image: shounak6942/watchtower:latest
    container_name: watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Optional Apprise config file:
      # - ./apprise.yml:/config/apprise.yml:ro
    environment:
      TZ: ${TZ:-UTC}
      WATCHTOWER_CLEANUP: ${WATCHTOWER_CLEANUP:-true}
      WATCHTOWER_POLL_INTERVAL: ${WATCHTOWER_POLL_INTERVAL:-86400}
      WATCHTOWER_NOTIFICATION_REPORT: ${WATCHTOWER_NOTIFICATION_REPORT:-true}
      WATCHTOWER_NO_STARTUP_MESSAGE: ${WATCHTOWER_NO_STARTUP_MESSAGE:-true}
      # Notifications use Apprise bundled in this image. Do not add a separate Apprise service.
      # Set WATCHTOWER_NOTIFICATION_URL in `.env`, for example:
      #   WATCHTOWER_NOTIFICATION_URL=discord://webhook_id/webhook_token
      WATCHTOWER_NOTIFICATION_URL: ${WATCHTOWER_NOTIFICATION_URL:-}
      WATCHTOWER_NOTIFICATION_APPRISE_CONFIG: ${WATCHTOWER_NOTIFICATION_APPRISE_CONFIG:-}
