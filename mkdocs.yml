site_name: Watchtower
site_description: Automatically update running Docker containers when their images change.
site_url: https://dallergy.github.io/watchtower/
repo_url: https://github.com/dallergy/watchtower/
repo_name: dallergy/watchtower
edit_uri: edit/main/docs/
copyright: Community-maintained fork of containrrr/watchtower &middot; Apache-2.0
theme:
  name: 'material'
  # System fonts: fast, and no requests to third party font services
  font: false
  logo: images/logo-450px.png
  favicon: images/favicon.ico
  icon:
    repo: fontawesome/brands/github
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to system preference
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.footer
    - navigation.instant
    - navigation.instant.progress
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - search.highlight
    - search.suggest
    - toc.follow
extra_css:
  - stylesheets/theme.css
markdown_extensions:
    - toc:
        permalink: True
        separator: "_"
    - admonition
    - attr_list
    - md_in_html
    - pymdownx.details
    - pymdownx.emoji:
        emoji_index: !!python/name:material.extensions.emoji.twemoji
        emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - pymdownx.highlight
    - pymdownx.inlinehilite
    - pymdownx.superfences
    - pymdownx.magiclink:
        repo_url_shortener: True
        provider: github
        user: dallergy
        repo: watchtower
    - pymdownx.saneheaders
    - pymdownx.tabbed:
        alternate_style: true
nav:
   - 'Home': 'index.md'
   - 'Getting started':
       - 'Introduction': 'introduction.md'
       - 'Usage overview': 'usage-overview.md'
       - 'Compose and environment': 'compose.md'
       - 'Updating Watchtower': 'updating.md'
   - 'Configuration':
       - 'Arguments': 'arguments.md'
       - 'Container selection': 'container-selection.md'
       - 'Notifications': 'notifications.md'
       - 'Template preview': 'template-preview.md'
       - 'Private registries': 'private-registries.md'
       - 'Lifecycle hooks': 'lifecycle-hooks.md'
       - 'Stop signals': 'stop-signals.md'
   - 'Advanced':
       - 'Linked containers': 'linked-containers.md'
       - 'Remote hosts': 'remote-hosts.md'
       - 'Secure connections': 'secure-connections.md'
       - 'Running multiple instances': 'running-multiple-instances.md'
       - 'HTTP API mode': 'http-api-mode.md'
       - 'Metrics': 'metrics.md'
plugins:
    - search
